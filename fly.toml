# Fly.io deployment. The volume is the whole point: without it the SQLite
# database lives in the container filesystem and is lost on every restart.
#
#   fly launch --no-deploy            # once, to create the app
#   fly volumes create soto_data --size 1 --region lhr
#   fly secrets set ADMIN_PASSCODE=... SESSION_SECRET=...
#   fly deploy

app = "soto-padel"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/soto-padel.db"

[mounts]
  source = "soto_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite has a single writer and the database lives on one volume, so the app
  # must not be scaled to multiple machines without moving to Postgres first.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
