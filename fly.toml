# Fly.io deployment, running Postgres in-process against a volume.
#
# The volume is the whole point: without it the database lives in the container
# filesystem and is lost on every restart. Alternatively set DATABASE_URL with
# `fly secrets set` to use a managed Postgres, and the volume becomes optional.
#
#   fly launch --no-deploy            # once, to create the app
#   fly volumes create soto_data --size 1 --region lhr
#   fly deploy
#
# There is no sign-in, so anyone who can reach the app can change everything.
# Restrict access at the host if that matters.

app = "soto-padel"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/postgres"

[mounts]
  source = "soto_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The in-process database lives on one volume, so the app must not be scaled
  # to multiple machines unless DATABASE_URL points at a shared Postgres.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
